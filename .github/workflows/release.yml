name: Release

on:
  push:
    tags: ["v0.0.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.version.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate the release tag and workspace version
        id: version
        run: |
          git merge-base --is-ancestor HEAD origin/main
          python3 - <<'PY'
          import os, re, tomllib
          from pathlib import Path
          version = tomllib.loads(Path("Cargo.toml").read_text())["workspace"]["package"]["version"]
          assert re.fullmatch(r"0\.0\.(0|[1-9][0-9]*)", version), version
          assert os.environ["GITHUB_REF_NAME"] == f"v{version}", "tag and Cargo.toml disagree"
          packages = tomllib.loads(Path("Cargo.lock").read_text())["package"]
          assert all(p["version"] == version for p in packages if p["name"].startswith("gitcask-"))
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"version={version}", file=output)
              print(f"image=ghcr.io/{os.environ['GITHUB_REPOSITORY'].lower()}", file=output)
          PY

  ci:
    needs: validate
    uses: ./.github/workflows/ci.yml

  image:
    needs: [validate, ci]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ${{ needs.validate.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Untagged candidates are tested before the versioned manifest is published.
      - name: Build the native image and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            GITCASK_VERSION=${{ needs.validate.outputs.version }}
            GITCASK_BUILD_SHA=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,scope=image-${{ matrix.arch }},mode=max
      - name: Test the published candidate against rustfs
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker pull "$IMAGE@$DIGEST"
          scripts/smoke-image.sh "$IMAGE@$DIGEST" "$GITHUB_SHA"
      - name: Export the tested digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [validate, image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ${{ needs.validate.outputs.image }}
      VERSION: ${{ needs.validate.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested multi-platform manifest
        run: |
          if docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "Version $VERSION already exists; publish a new patch version instead."
            exit 1
          fi
          images=()
          for digest in "$RUNNER_TEMP/digests/"*; do
            images+=("$IMAGE@sha256:$(basename "$digest")")
          done
          test "${#images[@]}" -eq 2
          docker buildx imagetools create --tag "$IMAGE:$VERSION" "${images[@]}"
          docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' > "$RUNNER_TEMP/manifest.json"
      - name: Record the image digest in the GitHub release
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          manifest = json.loads((root / "manifest.json").read_text())
          platforms = {(m.get("platform", {}).get("os"), m.get("platform", {}).get("architecture")) for m in manifest["manifests"]}
          assert {("linux", "amd64"), ("linux", "arm64")} <= platforms, platforms
          image, version = os.environ["IMAGE"], os.environ["VERSION"]
          notes = f"""Container image for Linux amd64 and arm64.

          ```sh
          docker pull {image}:{version}
          ```

          Immutable reference: `{image}@{manifest['digest']}`

          Source commit: `{os.environ['GITHUB_SHA']}`

          Validation: workspace CI, rustfs smoke, and authenticated Git/LFS push, clone,
          and recovery from an empty cache using the release image on both architectures.

          Configure S3 credentials and JWT or introspection authentication before serving.
          See the [running guide](https://github.com/{os.environ['GITHUB_REPOSITORY']}/blob/{os.environ['GITHUB_REF_NAME']}/README.md#running-it).
          """
          import textwrap
          (root / "release.md").write_text(textwrap.dedent(notes))
          PY
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "gitcask $VERSION" --notes-file "$RUNNER_TEMP/release.md"
