name: Site

# Builds the documentation site (site/, AGENTS D54) whenever it or the Markdown it renders changes.
# Build only: deployment to Cloudflare Workers is a separate pipeline.

on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/**
      - "*.md"
      - .github/workflows/site.yml
  pull_request:
    paths:
      - site/**
      - docs/**
      - "*.md"
      - .github/workflows/site.yml
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: typecheck + OpenNext build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm exec opennextjs-cloudflare build
